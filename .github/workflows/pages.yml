# Alternative Pages deploy via Actions. The live site is currently served
# the simple way — from the `gh-pages` branch (Settings → Pages shows it).
# This workflow is kept for manual use if you switch Pages source to
# "GitHub Actions"; it does nothing on ordinary pushes.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
